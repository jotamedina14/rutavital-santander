spring.application.name=rutavital-santander
server.port=8080

# El navegador revalida la página, el JS y el CSS en cada carga (responde 304 si no cambiaron),
# así nunca se queda con una versión vieja de la interfaz
spring.web.resources.cache.cachecontrol.no-cache=true

# Archivo (en el classpath) con la red vial que se carga al iniciar
rutavital.red.archivo=red-vial-santander.json

# true: el bean ServicioRutas principal es el proxy ServicioRutasConCache
# false: el bean ServicioRutas principal es NavegadorRutas (sin caché)
rutavital.cache.habilitada=true
